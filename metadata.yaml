name: astrbot_plugin_xbnext
display_name: XBNEXT
short_desc: 修正引用、表情、身份指向等对话细节，附 Web 控制台。
desc: |
  XBNEXT：修正引用、表情与身份指向等对话细节的 AstrBot 插件。

  - 引用占位清洗，避免空白图片
  - QQ 表情翻译成文字，模型可理解
  - 回复指向索引，防止身份串台
  - 用户档案按群隔离，私聊独立
  - 撤回取消、图片瘦身、Token 用量展示，控制台独立开关
version: 0.2.3
author: Light
repo: https://github.com/imsuperone/xbnext
support_platforms:
  - aiocqhttp
pages:
  - name: manager
    title: XBNEXT 控制台
    path: pages/manager/index.html
astrbot_version: ">=3.4.0"
